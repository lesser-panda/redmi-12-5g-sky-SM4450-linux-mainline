# PCMs: hw:,0 = MultiMedia1 playback (RX_CODEC_DMA_RX_0, 2 lanes RX0/RX1), hw:,2 = MultiMedia3 capture (TX_CODEC_DMA_TX_3, 2 lanes = DEC0/DEC1).
# Speaker = macro INT2 -> SoundWire LO port -> WCD9370 RX3/AUX -> FourSemi FS1599 amplifier (I2C 0x34, scene 6; needs rx-macro stride2 fix, kernel m18).
# Earpiece = macro INT0 -> HPHL/EAR path.  Bottom microphone = amic3 -> ADC2 -> SWR_MIC0 (TX macro DEC0+DEC1).

SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
	]

	DisableSequence [
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX INT2_1 MIX1 INP0' RX0"
		cset "name='RX INT2_1 MIX1 INP1' RX1"
		cset "name='RX INT2_1 INTERP' 'RX INT2_1 MIX1'"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='LO Switch' 1"
		cset "name='CLSH PA Switch' 1"
		# the FS1599 amplifier is switched by the kernel (fs1599 DAPM widget behind the AUX output), not here
	]

	DisableSequence [
		cset "name='CLSH PA Switch' 0"
		cset "name='LO Switch' 0"
		cset "name='AUX_RDAC Switch' 0"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX INT2_1 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0_1 MIX1 INP1' RX1"
		cset "name='RX INT0_1 INTERP' 'RX INT0_1 MIX1'"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RDAC3_MUX' RX1"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='CLSH PA Switch' 1"
	]

	DisableSequence [
		cset "name='CLSH PA Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT0_1 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Bottom microphone"

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
	]

	DisableSequence [
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
